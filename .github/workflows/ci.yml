name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check src tests

      - name: Run unit tests (offline, no Docker/Redis required)
        run: pytest -q --cov=agentops_sentinel --cov-report=term-missing

      - name: Build Docker image
        run: docker build -t agentops-sentinel:ci .

  integration-redis:
    # Optional job: exercises the real-Redis path (test_integration_redis.py)
    # against an actual Redis service container. The `test` job above never
    # depends on this -- it passes fully offline via fakeredis.
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run real-Redis integration test
        env:
          AGENTOPS_TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest -q -m integration
